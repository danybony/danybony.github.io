{% assign share_url = page.url | absolute_url | url_encode %}
{% assign share_title = page.title | url_encode %}
<div class="share">
  <span class="share__label">Share</span>
  <a class="icon-btn" href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url }}" target="_blank" rel="noopener" aria-label="Share on LinkedIn" title="Share on LinkedIn"><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i></a>
  <a class="icon-btn" href="https://bsky.app/intent/compose?text={{ share_title }}%20{{ share_url }}" target="_blank" rel="noopener" aria-label="Share on Bluesky" title="Share on Bluesky"><i class="fa-brands fa-bluesky" aria-hidden="true"></i></a>
  <a class="icon-btn" href="https://x.com/intent/tweet?text={{ share_title }}&amp;url={{ share_url }}&amp;via=danybony_" target="_blank" rel="noopener" aria-label="Share on X" title="Share on X"><i class="fa-brands fa-x-twitter" aria-hidden="true"></i></a>
  <button class="icon-btn" type="button" data-copy-link="{{ page.url | absolute_url }}" aria-label="Copy link" title="Copy link"><i class="fa-solid fa-link" aria-hidden="true"></i></button>
</div>
