<dialog class="lightbox" data-lightbox aria-label="Image viewer">
  <button class="lightbox__close icon-btn" type="button" data-lightbox-close aria-label="Close">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button class="lightbox__nav lightbox__nav--prev icon-btn" type="button" data-lightbox-prev aria-label="Previous image">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <figure class="lightbox__figure">
    <img data-lightbox-img alt="">
    <figcaption data-lightbox-caption></figcaption>
  </figure>
  <button class="lightbox__nav lightbox__nav--next icon-btn" type="button" data-lightbox-next aria-label="Next image">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</dialog>
