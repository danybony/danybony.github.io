<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__brand">
      <p class="site-footer__name">{{ site.author.name }}</p>
      <p class="site-footer__bio">{{ site.author.bio }}</p>
    </div>
    <div class="site-footer__links">
      {% include social-links.html %}
      <p class="site-footer__meta">
        &copy; {{ site.time | date: '%Y' }} {{ site.name }}
        <span aria-hidden="true">·</span> <a href="{{ '/feed.xml' | relative_url }}"><i class="fa-solid fa-rss" aria-hidden="true"></i> Feed</a>
        <span aria-hidden="true">·</span> <a href="{{ '/terms.html' | relative_url }}">Privacy</a>
      </p>
    </div>
  </div>
</footer>
