<!doctype html>
<html lang="{{ site.locale | slice: 0, 2 | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>
  <body class="layout--{{ page.layout | default: 'default' }}">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}

    <main id="main">
      {{ content }}
    </main>

    {% include footer.html %}
    {% include lightbox.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    {% if jekyll.environment == 'production' and site.analytics.provider == 'google-gtag' %}
      {% include analytics.html %}
    {% endif %}
  </body>
</html>
